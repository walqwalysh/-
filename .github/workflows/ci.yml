name: جودة التطبيق

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: الاختبارات وفحوص الجودة
    runs-on: ubuntu-latest

    steps:
      - name: جلب المصدر
        uses: actions/checkout@v4

      - name: إعداد pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: تثبيت الحزم
        run: pnpm install --frozen-lockfile

      - name: تشغيل الاختبارات
        run: pnpm test

      - name: فحص TypeScript
        run: pnpm check

      - name: فحص قواعد البرمجة
        run: pnpm lint
